# =============================================================================
# Apache Virtual Host — Alumni Association
# =============================================================================
#
# This configuration ensures:
# 1. DocumentRoot points to Laravel's public/ directory
# 2. AllowOverride All is set so the existing .htaccess works
#    (URL rewriting, gzip compression, browser caching headers)
# 3. ServerName is configurable via environment variable
#
# This file is copied into the Docker image at:
#   /etc/apache2/sites-available/000-default.conf
# =============================================================================

<VirtualHost *:80>
    # ServerName can be set via environment variable in Render dashboard.
    # Falls back to localhost for local Docker testing.
    ServerName ${SERVER_NAME}

    # Laravel serves all requests through public/index.php
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        # AllowOverride All enables the existing .htaccess file which handles:
        # - mod_rewrite: URL rewriting (pretty URLs via front controller)
        # - mod_deflate: gzip/brotli compression
        # - mod_expires: browser cache expiry headers
        # - mod_headers: Cache-Control headers for static assets
        AllowOverride All
        Require all granted

        # Disable directory listing for security
        Options -Indexes +FollowSymLinks
    </Directory>

    # Log to stderr/stdout so Render can capture them
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
